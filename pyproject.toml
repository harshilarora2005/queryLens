[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["eval/results"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]  # line length handled by formatter/reviewer judgment, not a hard CI gate

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
# Codebase predates type annotations in most places; strict mode would be
# noise-only right now. Checked in CI as informational (non-blocking) —
# see .github/workflows/ci.yml — rather than silently skipped, so gaps
# stay visible without gating merges on a full retrofit.
disallow_untyped_defs = false
check_untyped_defs = true